name: Bug report
description: Report a repeatable application or result problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what the application returned and what you expected.
    validations:
      required: true
  - type: input
    id: prefix
    attributes:
      label: Public test prefix
      description: Use a public prefix that can be shared safely.
  - type: input
    id: asn
    attributes:
      label: Expected ASN
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
